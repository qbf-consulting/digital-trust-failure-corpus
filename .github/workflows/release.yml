name: publish release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Require main branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release publication must be dispatched from main; got ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Run release-gate tests
        run: |
          python -m unittest discover -s tests -v
          python tools/validate.py

      - name: Resolve release inputs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          NOTES="docs/release-notes-v${VERSION}.md"

          if [[ -z "${VERSION}" ]]; then
            echo "VERSION is empty." >&2
            exit 1
          fi
          if [[ ! -f "${NOTES}" ]]; then
            echo "Missing release notes: ${NOTES}" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to overwrite." >&2
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to overwrite." >&2
            exit 1
          fi

          gh release list --limit 100 --json name --jq '.[].name' > "${RUNNER_TEMP}/release-titles.txt"
          FLOWER="$(python tools/select_release_name.py \
            --pool release/national-flower-codenames.txt \
            --used-titles "${RUNNER_TEMP}/release-titles.txt")"
          TITLE="${FLOWER} — ${TAG}"

          {
            printf '**Release codename:** %s\n\n' "${FLOWER}"
            cat "${NOTES}"
          } > "${RUNNER_TEMP}/release-notes.md"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "flower=${FLOWER}" >> "${GITHUB_OUTPUT}"
          echo "title=${TITLE}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TITLE}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --latest

      - name: Verify publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          ACTUAL_TITLE="$(gh release view "${TAG}" --json name --jq '.name')"
          if [[ "${ACTUAL_TITLE}" != "${TITLE}" ]]; then
            echo "Release title mismatch: expected '${TITLE}', got '${ACTUAL_TITLE}'." >&2
            exit 1
          fi

          IS_LATEST="$(gh release list --limit 100 --json tagName,isLatest --jq ".[] | select(.tagName == \"${TAG}\") | .isLatest")"
          if [[ "${IS_LATEST}" != "true" ]]; then
            echo "Release ${TAG} was published but is not marked Latest." >&2
            exit 1
          fi

      - name: Summarize release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FLOWER: ${{ steps.release.outputs.flower }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          {
            echo "## Release published"
            echo
            echo "- Tag: \`${TAG}\`"
            echo "- Codename: **${FLOWER}**"
            echo "- Release: **${TITLE}**"
            echo "- Latest: **yes**"
            echo "- Target commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
