name: validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Enforce canonical case-version bumps
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          python -m tools.check_case_versions --base "${BASE_SHA}"

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate corpus
        run: python tools/validate.py

      - name: Validate research source crosswalk
        run: python -m tools.validate_research_register

      - name: Validate inspected research source records
        run: python -m tools.validate_inspected_sources

      - name: Verify taxonomy coverage report
        run: python -m tools.taxonomy_coverage > /tmp/dtfc-taxonomy-coverage.json

      - name: Install pinned OPA release
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/open-policy-agent/opa/releases/download/v1.9.0/opa_linux_amd64_static \
            --output /tmp/opa
          echo '66fa66f3b730b2fb086003863428b382b2898d343adb4b5dfab5598b4d739eed  /tmp/opa' | sha256sum --check
          chmod +x /tmp/opa
          /tmp/opa version

      - name: Run real OPA integration tests
        env:
          DTFC_OPA_BIN: /tmp/opa
        run: python -m unittest discover -s tests -p 'test_opa_integration.py' -v

