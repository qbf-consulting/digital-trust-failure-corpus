name: validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate corpus
        run: python tools/validate.py

      - name: Install pinned OPA release
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/open-policy-agent/opa/releases/download/v1.9.0/opa_linux_amd64_static \
            --output /tmp/opa
          echo '66fa66f3b730b2fb086003863428b382b2898d343adb4b5dfab5598b4d739eed  /tmp/opa' | sha256sum --check
          chmod +x /tmp/opa
          /tmp/opa version

      - name: Run real OPA integration tests
        env:
          DTFC_OPA_BIN: /tmp/opa
        run: python -m unittest discover -s tests -p 'test_opa_integration.py' -v

