site_name: Digital Trust Failure Corpus
site_description: Machine-readable failure propositions, evidence requirements, and falsification criteria for digital trust systems.
site_url: https://qbf-consulting.github.io/digital-trust-failure-corpus/
repo_url: https://github.com/qbf-consulting/digital-trust-failure-corpus
repo_name: qbf-consulting/digital-trust-failure-corpus
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  highlightjs: true
  navigation_depth: 4

nav:
  - Home: index.md
  - Corpus:
      - Catalogue: corpus/index.md
  - Guides:
      - Taxonomy: taxonomy.md
      - Descriptive taxonomy coverage: taxonomy-coverage.md
      - Consuming the corpus: consuming-the-corpus.md
      - Authoring cases: authoring-cases.md
      - Validation: validation.md
  - Research notes:
      - Authority tranche observations: authority-tranche-observations.md
      - Decision-resolution observations: decision-resolution-tranche-observations.md
      - Privacy and correlation observations: privacy-correlation-tranche-observations.md
  - Executable experiments:
      - Conformance vectors: conformance-vectors.md
      - Independent target admission: independent-target-admission.md
      - Executed synthetic target pair: executed-target-pair.md
      - Portable execution bindings: executable-consumption.md
      - Standalone consumer: independent-consumer.md
      - OPA integration: opa-consumer.md
  - External research:
      - Source crosswalk: external-corpus-crosswalk.md
      - Semantic screening: external-semantic-screening.md
      - Inspected source records: inspected-external-records.md
      - Tool-output boundary: tool-output-boundary-research.md
      - Case maturity and release gates: case-maturity-and-release-gates.md
      - Case quality review checklist: case-quality-review-checklist.md
  - Project execution:
      - Evidence-gated tranche: evidence-gated-execution-tranche.md
  - Releases:
      - v0.4.0: release-notes-v0.4.0.md
      - v0.3.0: release-notes-v0.3.0.md
      - v0.2.0: release-notes-v0.2.0.md
      - v0.1.0: release-notes-v0.1.0.md
      - Release process: releasing.md
      - Non-publishing safety preflight: release-safety-preflight.md

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true

strict: true

extra:
  status: v0.4.0
